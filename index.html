<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>What to Eat - WatchOS Honeycomb</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #f3f4f6;
            overflow: hidden;
            touch-action: none;
        }
        .dot-matrix {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .food-bubble {
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: stroke 0.2s ease, fill 0.2s ease;
            cursor: pointer;
        }
        .food-bubble:hover {
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 3px;
        }
        /* Custom scrollbar for modals */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body class="dot-matrix h-screen w-screen flex flex-col justify-between select-none relative overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="w-full px-5 py-3 flex items-center justify-between z-30 bg-black/40 backdrop-blur-md border-b border-white/10">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-orange-500 inline-block animate-pulse"></span>
            <h1 class="text-sm font-semibold tracking-wider uppercase text-gray-200">What To Eat</h1>
            <span id="item-count" class="text-xs bg-white/10 px-2 py-0.5 rounded-full text-gray-400">31 items</span>
        </div>
        <div class="flex items-center space-x-2">
            <button id="btn-sync-modal" class="text-xs bg-white/10 hover:bg-white/20 text-gray-200 px-3 py-1.5 rounded-full font-medium transition flex items-center space-x-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>Sync Sheet</span>
            </button>
        </div>
    </header>

    <!-- Main Canvas Viewport -->
    <main id="canvas-container" class="absolute inset-0 z-10 flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing">
        <svg id="honeycomb-svg" class="w-full h-full absolute inset-0"></svg>
    </main>

    <!-- Center Indicator / Crosshair -->
    <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-20">
        <div class="w-2 h-2 rounded-full border border-white/30"></div>
    </div>

    <!-- Randomizer Result Modal / Overlay -->
    <div id="winner-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="text-center p-8 max-w-sm w-full mx-4 bg-zinc-900/90 border border-white/15 rounded-3xl shadow-2xl transform scale-95 transition-all duration-300" id="winner-card">
            <div class="text-xs uppercase tracking-widest text-orange-400 font-bold mb-2">Selected For You</div>
            <div id="winner-title" class="text-3xl font-bold text-white mb-1">Paneer Biryani</div>
            <div id="winner-type" class="text-xs text-gray-400 mb-6 uppercase tracking-wider">Meal</div>
            <div class="flex space-x-3">
                <button id="btn-spin-again" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-medium py-3 rounded-2xl transition
